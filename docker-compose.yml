version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: finbooks-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: finbooks
      POSTGRES_USER: finbooks
      POSTGRES_PASSWORD: ${DB_PASS:-finbooks_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finbooks"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finbooks-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASS:-redis_dev} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS:-redis_dev}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: finbooks-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-finbooks}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-finbooks_dev_secret}
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
